[project]
name = "outbreak-ripple"
version = "0.2.0"
description = "Offline educational simulation of a fictional Indian district (teaching tool, not a clinical tool)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["engine", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
